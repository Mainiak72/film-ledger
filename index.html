<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Film Ledger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0908">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sticky-top">
    <div class="brand">
      <img class="brand-mark" src="film-ledger-title.png?v=557" alt="Film Ledger">
      <span class="brand-ver">v5.95</span>
    </div>

    <div class="search-bar">
      <div class="search-row">
        <input id="searchQuery" type="text" placeholder="Search title, actor, director, year..." oninput="onSearchInput()" onkeydown="if(event.key==='Enter') searchMovies()">
        <button type="button" onclick="searchMovies()">Search</button>
      </div>
    </div>
    <div id="suggestions" class="suggestions"></div>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
    <div id="searchResults"></div>

    <div class="mode-switch">
      <button type="button" id="btnMovies" class="mode-btn active" onclick="setMode('movie')">Movies</button>
      <button type="button" id="btnTV" class="mode-btn" onclick="setMode('tv')">TV Shows</button>
    </div>

    <nav id="subnav">
      <button type="button" data-tab="watchlist">Watchlist</button>
      <button type="button" data-tab="watching">Watching</button>
      <button type="button" data-tab="alltime">Watched</button>
      <button type="button" data-tab="top10">Top 10</button>
      <button type="button" data-tab="decades">Decades</button>
      <button type="button" data-tab="stats">Stats</button>
      <button type="button" data-tab="recs">Recommended</button>
      <button type="button" data-tab="seasonal">Seasonal</button>
      <button type="button" data-tab="free">Free</button>
      <button type="button" data-tab="settings">Settings</button>
    </nav>
  </div>

  <div class="container">
    <div id="seasonal" class="tabs active"></div>
    <div id="watchlist" class="tabs"></div>
    <div id="watching" class="tabs"></div>
    <div id="alltime" class="tabs"></div>
    <div id="recs" class="tabs"></div>
    <div id="free" class="tabs"></div>
    <div id="top10" class="tabs"></div>
    <div id="decades" class="tabs"></div>
    <div id="stats" class="tabs"></div>
    <div id="settings" class="tabs"></div>
    <div id="least" class="tabs"></div>
  </div>

  <script src="app.js?v=595"></script>
</body>
</html>
