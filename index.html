<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Film Ledger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0908">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sticky-top">
    <div class="brand">
      <img class="brand-mark" src="film-ledger-title.png?v=518" alt="Film Ledger">
      <span class="brand-ver">v5.18</span>
      <button type="button" id="settingsBtn" onclick="toggleSettings()" aria-label="Settings">
        <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
          <circle cx="20" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="2.6"/>
          <circle cx="20" cy="24" r="4.5" fill="none" stroke="currentColor" stroke-width="2.6"/>
          <circle cx="20" cy="11.5" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="31" cy="18" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="27.5" cy="32.5" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="12.5" cy="32.5" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="9" cy="18" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <rect x="33" y="20" width="13" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="36.5" cy="22.4" r="1.1" fill="currentColor"/>
          <circle cx="36.5" cy="25.6" r="1.1" fill="currentColor"/>
          <circle cx="42.5" cy="22.4" r="1.1" fill="currentColor"/>
          <circle cx="42.5" cy="25.6" r="1.1" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="search-bar">
      <input id="apiKey" type="text" placeholder="TMDB API key" autocomplete="off" style="width:100%; display:none; margin-bottom:8px;">
      <div class="search-row">
        <input id="searchQuery" type="text" placeholder="Search title, actor, director, year..." onkeydown="if(event.key==='Enter') searchMovies()">
        <button type="button" onclick="searchMovies()">Search</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
    <div id="searchResults"></div>

    <div class="mode-switch">
      <button type="button" id="btnMovies" class="mode-btn active" onclick="setMode('movie')">Movies</button>
      <button type="button" id="btnTV" class="mode-btn" onclick="setMode('tv')">TV Shows</button>
    </div>

    <nav id="subnav">
      <button type="button" class="active" data-tab="seasonal">Seasonal</button>
      <button type="button" data-tab="watchlist">Watchlist</button>
      <button type="button" data-tab="watching">Watching</button>
      <button type="button" data-tab="alltime">Watched</button>
      <button type="button" data-tab="recs">Recommended</button>
      <button type="button" data-tab="top10">Top 10</button>
      <button type="button" data-tab="decades">Decades</button>
      <button type="button" data-tab="least">Least</button>
      <button type="button" data-tab="stats">Stats</button>
    </nav>
  </div>

  <div class="container">
    <div id="seasonal" class="tabs active"></div>
    <div id="watchlist" class="tabs"></div>
    <div id="watching" class="tabs"></div>
    <div id="alltime" class="tabs"></div>
    <div id="recs" class="tabs"></div>
    <div id="top10" class="tabs"></div>
    <div id="decades" class="tabs"></div>
    <div id="stats" class="tabs"></div>
    <div id="least" class="tabs"></div>
  </div>

  <script src="app.js?v=518"></script>
</body>
</html>
